name: Validate data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical data
        run: node scripts/validate.mjs
      - name: Check public UI JavaScript syntax
        run: node --check app.js
      - name: Check required public UI files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
