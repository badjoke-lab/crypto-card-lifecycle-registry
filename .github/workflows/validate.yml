name: Validate data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical data
        run: node scripts/validate.mjs
      - name: Check public UI JavaScript syntax
        run: |
          node --check app.js
          node --check public-ui.js
          node --check analytics.js
          node --check scripts/build-seo-pages.mjs
      - name: Build crawlable SEO surface
        run: node scripts/build-seo-pages.mjs
      - name: Check generated SEO files
        run: |
          test -s sitemap.xml
          test -s robots.txt
          test -s program/metamask-card/index.html
          test -s provider/mastercard/index.html
          grep -Fq 'https://cclr.badjoke-lab.com/' sitemap.xml
          grep -Fq 'Sitemap: https://cclr.badjoke-lab.com/sitemap.xml' robots.txt
          grep -Fq 'G-GC3PS5DW5M' program/metamask-card/index.html
      - name: Check root discoverability and public operations links
        run: |
          grep -Fq 'https://cclr.badjoke-lab.com/' index.html
          grep -Fq 'rel="canonical"' index.html
          grep -Fq 'application/ld+json' index.html
          grep -Fq 'G-GC3PS5DW5M' index.html
          grep -Fq './contact.html' index.html
          grep -Fq './analytics.js' index.html
          grep -Fq 'donation_address_copy' support.html
          grep -Fq 'G-GC3PS5DW5M' support.html
          ! grep -Fq 'wallet options used by HEI' support.html
          ! grep -R -Fq 'https://badjoke-lab.github.io/crypto-card-lifecycle-registry/' index.html methodology.html corrections.html contact.html support.html scripts/build-seo-pages.mjs
      - name: Check required public UI files
        run: |
          test -s index.html
          test -s styles.css
          test -s role-graph.css
          test -s overview.css
          test -s accessibility.css
          test -s app.js
          test -s public-ui.js
          test -s analytics.js
          test -s contact.html
          test -s support.html
          test -s googlecd270d496efd8db3.html
