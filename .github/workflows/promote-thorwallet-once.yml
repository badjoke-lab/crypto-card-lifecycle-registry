name: Promote THORWallet Card once

on:
  push:
    branches:
      - feat/thorwallet-card

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote THORWallet Card canonical records
        run: python scripts/promote_thorwallet_once.py
      - name: Remove one-shot helper
        run: |
          rm scripts/promote_thorwallet_once.py
          rm .github/workflows/promote-thorwallet-once.yml
      - name: Commit canonical promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data scripts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Promote THORWallet Card canonical records"
          git push origin HEAD:feat/thorwallet-card
